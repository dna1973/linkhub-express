# Robôs que montam a prévia de um link compartilhado (WhatsApp, Telegram, redes sociais).
# Eles não rodam o JavaScript do site: leem só as tags og do HTML que recebem.
map $http_user_agent $linkhub_preview_bot {
    default 0;
    "~*(whatsapp|facebookexternalhit|facebot|meta-externalagent|twitterbot|telegrambot|linkedinbot|slackbot|discordbot|skypeuripreview|pinterestbot|redditbot|embedly|iframely|vkshare)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/wasm;

    # Assets com hash no nome: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Motor e modelo da remoção de fundo. A versão está no caminho (/mediapipe/1.1.1/...): 30 dias de cache.
    # Sem bloco types aqui: o mime.types do nginx 1.27 já tem application/wasm, e um bloco types
    # substituiria todos os outros tipos. O .tflite comprime pouco e fica fora do gzip_types.
    location /mediapipe/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    # SVGs e catálogos dos ícones dos links. A versão está no caminho (/vendor-icons/lucide/0.462.0/...): 30 dias de cache.
    location /vendor-icons/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    # PWA: service worker e manifest nunca podem ficar presos em cache
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Perfil público (/:username). Para um robô de prévia, devolve as tags og do perfil (nome, bio e foto),
    # montadas pela edge function linkhub-profile-og; quem visita recebe o site normal.
    # Ficam de fora as rotas do app: a mesma lista de APP_ROUTE_SEGMENTS (src/lib/serviceWorkerRoutes.ts),
    # conferida por src/lib/nginxPreview.test.ts.
    location ~ "^/(?!(?:auth|dashboard|admin|analytics|exemplo|install|privacy)$)([a-z0-9_]{3,20})$" {
        add_header Vary "User-Agent" always;
        if ($linkhub_preview_bot) {
            rewrite ^/([a-z0-9_]+)$ /__linkhub_og/$1 last;
        }
        try_files $uri /index.html;
    }

    location ~ "^/__linkhub_og/([a-z0-9_]{3,20})$" {
        internal;
        # DNS do Docker (rede padrão do compose); o proxy_pass com variável resolve o nome a cada pedido
        resolver 127.0.0.11 valid=300s ipv6=off;
        resolver_timeout 5s;
        proxy_pass https://supabase-api.avila.ia.br/functions/v1/linkhub-profile-og?u=$1;
        proxy_ssl_server_name on;
        proxy_set_header Host supabase-api.avila.ia.br;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        # private: um cache compartilhado (Cloudflare) nunca entrega a página dos robôs a quem visita
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, max-age=300" always;
        add_header Vary "User-Agent" always;
        # Se a edge function falhar, o robô recebe o site normal (prévia genérica do LinkHub)
        proxy_intercept_errors on;
        error_page 400 404 500 502 503 504 = @linkhub_spa;
    }

    location @linkhub_spa {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    # SPA fallback (demais rotas do app)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
