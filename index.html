<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    
    <!-- SEO -->
    <title>LinkHub Express - Sua página de links personalizada</title>
    <meta name="description" content="Crie uma página personalizada para todos os seus links importantes. Compartilhe redes sociais, websites e projetos em um só lugar.">
    <meta name="author" content="LinkHub Express" />
    <link rel="canonical" href="https://linkhub.avila.ia.br" />

    <!-- Security Headers via meta tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph -->
    <meta property="og:title" content="LinkHub Express - Sua página de links personalizada" />
    <meta property="og:description" content="Crie uma página personalizada para todos os seus links importantes." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://linkhub.avila.ia.br" />
    <meta property="og:image" content="https://linkhub.avila.ia.br/icons/icon-512x512.png" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LinkHub Express" />
    <meta name="twitter:description" content="Sua página de links personalizada" />
    <meta name="twitter:image" content="https://linkhub.avila.ia.br/icons/icon-512x512.png" />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#0a0f1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LinkHub" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;600&family=Dancing+Script:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&family=Lora:wght@400;500;600;700&family=Source+Code+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
